name: ScheduleMADI CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          
      # Единственный тестовый проект решения; MAUI не нужен этому Ubuntu job.
      # При добавлении тестовых проектов расширьте ОБЕ команды restore/test.
      - name: Restore dependencies
        run: dotnet restore ScheduleMadi.Tests/ScheduleMadi.Tests.csproj

      - name: Run Tests
        run: dotnet test ScheduleMadi.Tests/ScheduleMadi.Tests.csproj --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # Summary не требует write-token и доступен также для PR из форков.
      - name: Test Results Summary
        if: always()
        shell: python
        run: |
          import html
          import os
          from collections import Counter
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def text(value):
              return html.escape(value or "").replace("|", "&#124;").replace("\n", " ").replace("\r", " ")

          reports = sorted(Path("TestResults").glob("*.trx"))
          lines = ["## Test results", ""]
          if not reports:
              lines += ["No TRX report was produced. Check the restore/test step logs.", ""]
          for report in reports:
              root = ET.parse(report).getroot()
              ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
              results = root.findall(".//t:UnitTestResult", ns)
              counts = Counter(r.get("outcome", "Unknown") for r in results)
              lines += ["### " + text(report.name), "", ", ".join(f"{text(k)}: {v}" for k, v in sorted(counts.items())) or "No completed tests.", ""]
              lines += ["| Test | Outcome | Duration |", "| --- | --- | --- |"]
              for result in results:
                  lines.append("| " + " | ".join(text(result.get(k)) for k in ("testName", "outcome", "duration")) + " |")
              lines.append("")
              for result in results:
                  if result.get("outcome") in ("Passed", "NotExecuted"):
                      continue
                  details = "\n".join(result.find("t:Output", ns).itertext()) if result.find("t:Output", ns) is not None else "No failure details recorded."
                  lines += ["<details><summary>" + text(result.get("testName")) + "</summary>", "", "<pre>" + html.escape(details[:16000]) + "</pre>", "", "</details>", ""]
              for info in root.findall(".//t:RunInfo", ns):
                  lines += ["<pre>" + html.escape("".join(info.itertext())[:16000]) + "</pre>", ""]
          lines += ["Full TRX files are available in the test-results artifact.", ""]
          body = "\n".join(lines).encode("utf-8")
          if len(body) > 900000:
              body = body[:900000] + b"\n\nSummary truncated; see the full TRX artifact.\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(body.decode("utf-8", errors="ignore"))

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        # Fork/Dependabot PR имеют read-only token; отчёт выше остаётся доступен.
        if: >-
          always() && hashFiles('TestResults/*.trx') != '' && github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
        with:
          files: "TestResults/*.trx"
          job_summary: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "TestResults/*.trx"

  build:
    name: Build MAUI Android
    runs-on: ubuntu-latest
    needs: test
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore MAUI Android workload
        run: dotnet workload restore ScheduleMADI/ScheduleMADI.csproj

      - name: Build validation APK
        if: github.event_name == 'pull_request' || github.repository != 'wildchair/ScheduleMADI' || github.ref != 'refs/heads/master'
        run: |
          dotnet publish ScheduleMADI/ScheduleMADI.csproj \
            -c Release -f net10.0-android36.0 \
            -o:release_apk/ \
            -p:AndroidPackageFormats="apk"

      - name: Decode keystore
        if: github.event_name != 'pull_request' && github.repository == 'wildchair/ScheduleMADI' && github.ref == 'refs/heads/master'
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Build signed AAB
        if: github.event_name != 'pull_request' && github.repository == 'wildchair/ScheduleMADI' && github.ref == 'refs/heads/master'
        run: |
          dotnet publish ScheduleMADI/ScheduleMADI.csproj \
            -c Release -f net10.0-android36.0 \
            -o:release_aab/ \
            -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.majorMinorPatch }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormats="aab" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=../keystore.jks \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed APK
        if: github.event_name != 'pull_request' && github.repository == 'wildchair/ScheduleMADI' && github.ref == 'refs/heads/master'
        run: |
          dotnet publish ScheduleMADI/ScheduleMADI.csproj \
            -c Release -f net10.0-android36.0 \
            -o:release_apk/ \
            -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.majorMinorPatch }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormats="apk" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=../keystore.jks \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: |
            ./release_aab/*-Signed.aab
            ./release_apk/*-Signed.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'wildchair/ScheduleMADI' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: scopesorted
          args: -u -t v${{ needs.build.outputs.semVer }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.semVer }}
          name: v${{ needs.build.outputs.semVer }}
          body_path: CHANGELOG.md
          target_commitish: ${{ github.sha }}
          files: |
            ./release_apk/*-Signed.apk

  deploy_play_store:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'wildchair/ScheduleMADI' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: scopesorted
          args: -u -t v${{ needs.build.outputs.semVer }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Prepare Release Notes (English)
        shell: bash
        run: |
          mkdir -p whatsnew

          sed \
            -e '/^# Changelog$/d' \
            -e '/^All notable changes to this project will be documented in this file\.$/d' \
            -e '/^<!-- generated by git-cliff -->$/d' \
            -e 's/^## //' \
            -e 's/^### /🔹 /' \
            -e 's/^- /• /' \
            -e 's/• \*(No Category)\* /• /' \
            CHANGELOG.md > whatsnew/whatsnew-en-US

          cat whatsnew/whatsnew-en-US

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-artifacts

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.wildchair.schedulemadi
          releaseFiles: release_aab/*-Signed.aab
          tracks: production
          status: completed
          whatsNewDirectory: whatsnew
