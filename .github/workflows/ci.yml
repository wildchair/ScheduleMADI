name: ScheduleMADI CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'
          workloads: maui-android
          
      - name: Restore dependencies
        run: dotnet restore ScheduleMADI.sln

      - name: Run Tests
        # Флаг --logger "trx" нужен для генерации отчетов в формате, понятном GitHub
        run: dotnet test ScheduleMADI.sln --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/*.trx"

  build:
    name: Build MAUI Android
    runs-on: ubuntu-latest
    needs: test
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.x'
          workloads: maui-android

      - name: Restore MAUI Android workload
        run: dotnet workload restore ScheduleMADI/ScheduleMADI.csproj

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > keystore.jks

      - name: Build signed AAB
        run: |
          dotnet publish ScheduleMADI/ScheduleMADI.csproj \
            -c Release -f net9.0-android35.0 \
            -o:release_aab/ \
            -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.majorMinorPatch }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormats="aab" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=../keystore.jks \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed APK
        run: |
          dotnet publish ScheduleMADI/ScheduleMADI.csproj \
            -c Release -f net9.0-android35.0 \
            -o:release_apk/ \
            -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.majorMinorPatch }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormats="apk" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=../keystore.jks \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: |
            ./release_aab/*-Signed.aab
            ./release_apk/*-Signed.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: scopesorted
          args: -u -t v${{ needs.build.outputs.semVer }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-artifacts
          path: release_apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.semVer }}
          name: Release v${{ needs.build.outputs.semVer }}
          body_path: CHANGELOG.md
          target_commitish: ${{ github.sha }}
          files: |
            android-artifacts/release_apk/*-Signed.apk